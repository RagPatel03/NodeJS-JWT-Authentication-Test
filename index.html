<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" integrity="sha512-h9644v03pHqrIHThkvXhB2PJ8zf5E9IyVnrSfZg8Yj8k4RsO4zldcQc4Bi9iVLUCCsqNY0b4WXVV4UB+wbWENA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</head>
<body>
   <div class="container-fluid">

    <h1 class="row">Login</h1>

    <main>
        <div class="row">

            <label for="username">Username</label>
            <input type="text" name="username" id="username">

        </div>

        <div class="row">
            <label for="password">password</label>
            <input type="password" name="password" id="password">

        </div>

        <div>
            <button onclick="login()">Login</button>
            <button onclick="getDashboard()">Get Dashboard</button>
            <button onclick="getSettings()">Settings</button>
        </div>
    </main>



   </div>
<script>


    




    function login(){ 
        const data = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        axios.post('api/login', data)
        .then(res => {
            console.log(res.data);
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        if(res && res.data && res.data.success){
           const token = res.data.token;
           localStorage.setItem('jwt', token);
           getDashboard();

      
        }
            
        })
    }

    function getDashboard(){
        const token = localStorage.getItem('jwt');
        axios.get('api/dashboard', {
            headers: {
                'Authorization': 'Bearer ' + token
            }
        })
        .then(res => {
            if (res && res.data && res.data.success){
                document.querySelector('h1.row').innerHTML = 'Dashboard';
                document.querySelector('main').innerHTML = res.data.myContent;
            }
        });
     }

function getSettings(){
    const token = localStorage.getItem('jwt');
    axios.get('/api/settings', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => {
        if(res.data.success){
            document.querySelector('h1.row').innerHTML = 'Settings';
            document.querySelector('main').innerHTML = res.data.myContent;
            history.pushState({}, '', '/settings');
        }
    })
    .catch(err => handleJWTError(err));
}

function handleJWTError(err){
    if(err.response && err.response.status === 401){
        localStorage.removeItem('jwt');
        alert("Token expired. Redirecting to  page.");
        location.href = '/';
    }
}
function onLoad() {
    const token = localStorage.getItem('jwt');
    const path = window.location.pathname.replace('/', '');
    if(token){
        if(path === 'dashboard') getDashboard();
        else if(path === 'settings') getSettings();
    }
}
onLoad();

</script>
</body>
</html>
